<script>/* 수치/사건/상태/효과/점수 분리. 모든 수치 교육용 가정, 단위 만원·kg CO₂e·포인트. */
(function(global){'use strict';
const CONFIG={version:1,targetKg:1000,maxCreditPerKg:.8,weights:{water:1,chemical:4,consumable:3,equipment:2},resourceWeights:{'용수 서비스 단위':1,'약품 서비스 단위':4,'보조재 서비스 단위':3,'설비 배분 단위':2},stages:['사업 준비','회수와 운송','재활용 공정 운영','변화에 대응하고 개선'],batches:{10:250,13:250,15:200,19:300},scoreBounds:{economy:[-526.054,524.64],carbon:[436.485,2274],resource:[-192.68,330]},gradeThresholds:{economy:[30,50],carbon:[50,70],resource:[50,70]},resourceExplanationHtml:'<p>물·약품·보조재·설비를 게임이 정한 서비스 단위로 환산한 뒤 각각 가중치 1·4·3·2를 적용합니다. 서비스 단위는 실제 kg이 아닙니다. 에너지 사용은 탄소 지표에서 계산하며 자원 포인트와 혼동하지 않습니다.</p><div class="formula">용수 10×1 + 약품 5×4 + 보조재 4×3 = 투입 42점<br>투입 42 − 실제 처리의 회수 인정 30 = 순자원 부담 12점</div><p>회수 인정은 실제 처리한 배터리에만 연결됩니다. 최대 인정은 처리량 1kg당 0.8점, 전체 800점입니다. 마지막 잔여물은 앞서 인정받지 않은 부분만 회수합니다. 음수는 게임 기준에서 회수 인정 효과가 투입 부담보다 큼을 뜻하며 현실의 자원 소비가 사라졌다는 뜻은 아닙니다. 사용 후 배터리 자체를 새 원료로 중복 투입하지 않습니다.</p>',scope:'1000kg NCM 배터리의 회수·운송·전처리·재활용·품질검사·환경처리, 설비 제작·설치의 프로젝트 배분 부담과 위탁 처리를 포함. 채굴 대체 탄소는 차감하지 않음.'};
// 사건 데이터: 각 행 [제목,설명,용어,선택 1,사전안내 1,선택 2,사전안내 2].
const ROWS=[
['빈 작업장에 첫 불을 켜다','NCM 계열 사용 후 배터리 1,000kg을 처리하는 과업이 주어졌습니다. 같은 물량을 끝까지 책임져야 하지만 출발 방식은 고를 수 있습니다. 시설을 갖추면 초기 부담이 크고, 협력 시설을 쓰면 이후 이용료가 붙습니다.','설비 비용은 이번 과업에 배분한 비용이며 실제 공장 전체의 건설비가 아닙니다.','자체 시설을 중심으로 시작','지금 비용·설비 부담 증가. 이후 공정 이용료 감소.','임차·협력 시설로 시작','초기 비용 절감. 이후 처리량에 따른 이용료 발생.'],
['한 가지에 집중할까, 변화를 품을까','모두 NCM 배터리지만 제조사마다 포장과 상태가 다릅니다. 유연한 설비는 여러 조건에 대응하지만 준비에 더 많은 자원이 듭니다. 특정 작업 중심 설비도 추가 분류·협력 작업으로 전체 과업을 안전하게 처리합니다.','유연한 설비는 포장·상태 차이에 맞춰 작업 조건을 바꾸는 장치입니다.','유연한 설비에 투자','초기 비용 증가. 이후 재작업·보조재 감소.','특정 작업 중심으로 구성','초기 비용 절감. 다른 상태의 물량에 보완 작업 필요.'],
['아직 만들지 않은 자원의 구매자','회수 금속의 구매처가 가격 조건을 제안했습니다. 장기 계약은 큰 가격 상승의 기회도 일부 포기하는 약속입니다. 후반에는 모든 사업자에게 같은 금속 가격 하락이 찾아옵니다.','장기 공급은 가격을 안정시키고, 현물은 판매 시점의 가격을 따릅니다.','장기 공급 계약을 맺는다','지금 계약비 발생. 후반 가격 하락 영향 완화.','현물 시장에서 판매한다','초기 판매 가격 유리. 후반 가격 하락에 노출.'],
['연구실과 정비실 사이','첫 예산으로 모든 준비를 동시에 할 수는 없습니다. 연구개발은 새 공정의 가능성을 높이고 유지보수는 당장의 운전을 안정시킵니다. 어느 쪽이든 기본 안전 점검은 수행합니다.','시범 검증은 작은 물량으로 기술 적용 조건을 확인하는 과정입니다.','연구개발과 시범 검증에 배분','준비비 증가. 조건 충족 시 직접 재활용·품질 검증에 유리.','운영 안정성과 유지보수에 배분','후반 재작업·추가 교대 부담 완화. 신기술 검증은 제한적.'],
['배터리가 돌아오는 길을 잇다','배터리는 저절로 작업장에 모이지 않습니다. 지역 거점은 조정·안전 보관 비용이 들지만 운송 거리를 줄입니다. 기존 업체는 넓은 지역에서 물량을 확보합니다.','회수망은 사용 후 배터리를 안전하게 모아 시설로 연결하는 체계입니다.','지역 회수 거점을 구축','거점 준비비 발생. 이후 운송 거리·비용 감소.','기존 수거 업체와 계약','초기 준비비 절감. 광역 운송 부담 반영.'],
['가득 찬 트럭을 기다릴 시간','물량을 모아서 보내면 운송 횟수는 줄지만 안전 보관비가 듭니다. 자주 보내면 보관 시간을 줄이는 대신 더 여러 번 운송합니다. 같은 1,000kg의 운송을 비교합니다.','협력 업체 차량도 운송 배출에 포함합니다.','안전 보관 후 물량을 모아 운송','보관비 포함해 운송 비용·탄소 감소. 마감 조정비는 발생.','보관 시간을 줄여 자주 운송','운송 비용·탄소 증가. 마감 일정 대응이 쉬워짐.'],
['다음 주 물량까지 약속할까','총 처리 과업은 여전히 1,000kg입니다. 장기 회수 계약은 일정 예측을 돕지만 준비비를 요구합니다. 단기 계약은 유연하지만 마지막 물량 조정비가 커질 수 있습니다.','회수 계약은 원료 확보, 공급 계약은 산물 판매에 관한 약속입니다.','안정적 물량의 장기 회수 계약','지금 계약비 증가. 후반 일정 조정 비용 감소.','수요에 맞춘 단기 회수 계약','초기 비용 절감. 마지막 과업 완료 시 조정비 발생.'],
['겉모습이 비슷해도 같은 상태는 아니다','도착한 배터리를 검사할 차례입니다. 두 방식 모두 안전 검사를 통과한 NCM 배터리만 처리합니다. 기본 진단은 까다로운 물량을 검증된 협력 공정으로 보내고 그 부담도 합산합니다.','정밀 진단·분류는 조성·손상·상태에 맞게 경로를 배정합니다.','정밀 진단하고 세분화한다','검사비·에너지 증가. 재작업 감소, 직접 재활용 적합 물량 확보.','기본 진단 후 자체 처리 대상을 제한','검사비 절감. 일부 물량에 협력 보완 처리 부담 발생.'],
['안전한 해체를 반복하는 방법','재활용은 금속을 꺼내기 전에 안전하게 준비하는 일에서 시작됩니다. 자동화는 설치 부담을 먼저 내고 이후 반복 작업을 줄입니다. 인력·협력 방식도 검증된 절차로 같은 과업을 수행합니다.','전처리는 안전 확보·해체·분리 등 후속 회수 공정의 준비 단계입니다.','전처리 자동화 설비를 설치','지금 투자 부담. 이후 처리의 작업비·보조재·탄소 감소.','인력과 협력 업체를 활용','설치비 절감. 처리량에 따른 작업 비용·부담 발생.'],
['첫 250kg, 자원으로 돌아갈 경로','첫 250kg이 준비됐습니다. 열을 활용하는 결합 경로는 상태 차이에 대응하기 쉽지만 열에너지 부담이 큽니다. 습식 중심은 분류 품질에 민감하고 약품·물 관리가 중요합니다.','건식·습식 결합은 열처리 뒤 정제를 연결합니다. 습식도 전처리·정제·폐수 처리가 필요합니다.','건식·습식 결합 경로로 운영','열에너지·탄소 부담 큼. 상태 차이 대응에 유리. 잔여 자원 후속 관리 필요.','전처리와 습식 회수 중심으로 운영','열 부담 감소. 진단이 부족하면 약품·협력 보완 부담 증가.'],
['같은 전기, 다른 조달 조건','이미 첫 묶음의 배출은 발생했습니다. 다음 750kg의 전력 조달 조건을 결정합니다. 저탄소 전력은 계약·조달 비용을 요구하며 앞으로의 전력 관련 배출만 줄입니다.','저탄소 전력도 배출이 0은 아니며 열연료 배출을 없애지 않습니다.','비용을 감수하고 저탄소 전력 조달','계약비·이후 전력비 증가. 다음 공정부터 전력 관련 배출 감소.','일반 전력을 조달하며 효율 관리','추가 계약비 없음. 이후 일반 전력 배출계수 적용.'],
['한 번 쓴 약품의 다음 역할','정제 약품을 계속 새로 공급할지 고민이 생겼습니다. 재생 설비도 제작·운전에 자원과 에너지를 쓰며 완전한 순환은 아닙니다. 기존 방식도 적정 처리와 사용량 관리를 지킵니다.','약품 순환은 일부 약품을 회수·재생해 신규 투입을 줄입니다.','약품 재생·순환 설비에 투자','설치 부담 발생. 다음 공정부터 약품 구매비·투입 감소.','기존 공급을 유지하고 사용량 관리','설치 부담 없음. 신규 약품 구매·처리 부담 지속.'],
['더 깊이 회수할수록 생기는 일','두 번째 250kg을 처리하며 회수·정제 목표를 조정합니다. 강화 공정은 회수 성과와 산물을 늘리지만 비용·에너지를 더 씁니다. 기준 공정도 판매에 필요한 목표 품질을 충족합니다.','회수율과 순도는 다릅니다. 많이 회수해도 필요한 품질로 정제해야 합니다.','추가 회수·정제를 강화','회수 인정·산물 증가. 지금과 이후 비용·탄소 증가.','목표 품질 범위에서 비용 관리','추가 비용·에너지 억제. 일부 자원은 잔여물에 남음.'],
['물길을 한 번 더 돌릴 수 있다면','재이용은 남은 공정의 새 용수 부담을 줄이지만 설치·정화 비용이 듭니다. 기존 설비는 기준에 맞게 처리한 뒤 배출합니다. 어느 쪽도 불법 방류를 허용하지 않습니다.','공정수 재이용은 처리한 물을 일부 다시 쓰며 폐수가 전혀 없어지는 것은 아닙니다.','공정수 재이용 설비를 설치','지금 설치 부담. 이후 자체 처리의 용수 부담 감소.','기존 설비로 적절히 처리 후 배출','설치 부담 없음. 새 용수·적정 처리 부담 지속.'],
['구조를 살리는 작은 실험','세 번째 200kg의 일부로 새 기술을 시험할 기회입니다. 정밀 분류와 연구 준비를 모두 갖춰야 적용할 수 있습니다. 부적합 물량은 기존 검증 공정으로 처리해 과업을 유지합니다.','직접 재활용은 양극재 구조·조성 복원이며 원료 분리·상태·품질 검증이 전제입니다.','일부 물량으로 직접 재활용 시범','정밀 진단+연구 시 80kg 적용. 조건 부족 시 20kg 시험 후 기존 공정, 성공 보상 없음.','기존 공정의 안정적 개선에 집중','작은 개선비. 유지보수 준비가 있으면 절감 효과 증가.'],
['자원에 품질표를 붙이는 날','앞선 두 묶음 500kg의 산물을 판매합니다. 고규격 구매처는 검사와 품질 안정성을 요구합니다. 조건 부족 시 검사비를 쓰고도 기존 규격으로 판매합니다.','회수 산물이 곧 새 배터리는 아닙니다. 고규격 판로에는 검증 조건이 있습니다.','추가 품질 검증으로 고규격 구매처 확보','검사비 발생. 강화 정제 또는 정밀진단+연구 준비 시 단가 상승.','기존 규격에 맞춰 안정적으로 판매','추가 검사 부담 절감. 기존 판매 조건 적용.'],
['회수 금속의 가격표가 내려갔다','세 번째 200kg의 산물을 팔려는 날 금속 가격이 하락했습니다. 공통 시장 변화지만 초기 계약에 따라 타격은 다릅니다. 보관비를 감수하고 판매 시점을 나눌 수 있습니다.','판매 분산은 가격 하락을 없애거나 이익을 보장하지 않습니다.','보관비를 감수하고 판매 시점을 분산','보관비 발생. 현물 하락 일부 완화. 장기 계약이면 추가 단가 이익 없음.','즉시 판매해 현금 흐름 확보','보관비 없음. 현물은 하락 가격, 장기 계약은 약정 가격 적용.'],
['개선의 성과를 증명하라는 제안','성과 기반 환경 개선 지원사업이 열렸습니다. 저탄소 전력·약품 순환·공정수 재이용 중 두 가지 이상과 700kg 처리 실적이 필요합니다. 준비비는 지원 여부와 관계없이 발생합니다.','지원금은 산물 판매와 구분되는 기타 수익이며 요건 확인 후 한 번만 반영합니다.','조건을 확인하고 성과 기반 지원에 도전','준비비 35만원. 자격 충족 시 지원수익 130만원, 미달 시 미지급.','외부 지원 없이 자체 운영 개선','개선비 25만원. 마지막 내부 처리의 효율 향상.'],
['마감까지 남은 300kg','남은 300kg을 모두 처리해야 과업을 끝낼 수 있습니다. 위탁에는 운송·처리 부담이, 내부 처리에는 추가 교대·조정 부담이 따릅니다. 두 방식 모두 안전 기준을 지킵니다.','외주도 처리량·탄소·자원 부담을 합산해 같은 범위에서 비교합니다.','검증된 협력 업체에 잔여 물량 위탁','위탁·운송 비용과 배출 포함. 자체 설비 절감 일부는 미적용.','내부 운영 개선과 추가 교대로 완료','기존 설비·유지보수·계약에 따라 비용·탄소 변화.'],
['마지막 통에 남은 자원','배터리 1,000kg의 기본 처리는 끝났지만 잔여물이 남았습니다. 더 회수하려면 추가 에너지와 비용이 듭니다. 어느 선택이든 회수하지 않은 잔여물은 적절히 처리합니다.','추가 인정은 앞서 회수 인정하지 않은 잔여분에만 적용하며 중복 보상은 없습니다.','추가 비용·에너지로 잔여 자원 회수','잔여분 회수 인정·매출 증가. 추가 비용·탄소 발생.','추가 부담을 고려해 적정 처리로 마무리','새 회수 보상 없음. 적정 처리 비용·배출 반영.']
];
const EVENTS=ROWS.map((r,i)=>({id:i+1,title:r[0],description:r[1],term:r[2],stage:i<4?0:i<8?1:i<16?2:3,options:[{id:'A',label:r[3],hint:r[4]},{id:'B',label:r[5],hint:r[6]}]}));
const round=n=>Math.round((n+Number.EPSILON)*1000)/1000;
const weighted=u=>round(Object.keys(CONFIG.weights).reduce((n,k)=>n+(u[k]||0)*CONFIG.weights[k],0));
function initialState(){return {step:0,revenue:0,sales:0,grants:0,cost:0,money:0,input:0,credit:0,resource:0,carbon:0,processed:0,inventory:0,soldUnits:0,producedUnits:0,flags:{},history:[]};}
function supportEligible(s){const f=s.flags;return (Number(!!f.lowPower)+Number(!!f.circularChem)+Number(!!f.reuseWater)>=2)&&s.processed>=700;}
function getEvent(s){if(s.step>=20)return null;const e=EVENTS[s.step],f=s.flags,notes={6:f.localNetwork?'지역 거점 덕분에 운송 거리가 짧아졌습니다.':'기존 업체의 광역 회수망으로 운송 거리가 깁니다.',8:f.flex?'유연한 설비로 정밀 진단의 준비비가 줄어듭니다.':'특정 작업 중심 설비는 포장·상태 차이를 보완해야 합니다.',9:f.own?'자체 시설은 연계 설치비가 작습니다.':'임차 시설에는 추가 설치 조정비가 듭니다.',10:f.precise?'정밀 분류 덕분에 습식 중심의 보완 작업이 줄어듭니다.':'기본 진단을 보완하는 협력 작업을 습식 경로에 반영합니다.',12:f.hybrid?'결합 경로도 정제 약품을 쓰지만 순환 대상량은 작습니다.':'습식 중심은 약품 수요가 커 순환 절감 폭도 큽니다.',13:f.lowPower?'저탄소 전력은 이번부터 적용되며 첫 묶음의 배출은 유지됩니다.':'이번에도 일반 전력 조건을 적용합니다.',14:f.hybrid?'결합 경로의 정제수도 일부 재이용할 수 있습니다.':'습식 중심의 용수 수요가 커 재이용 절감 폭이 큽니다.',15:f.precise&&f.research?'정밀 진단과 연구 준비를 갖춰 적합 물량 80kg에 적용할 수 있습니다.':'조건이 부족해 20kg 시험 후 200kg 전부를 기존 공정으로 완료합니다.',16:f.deepRecovery||(f.precise&&f.research)?'고규격 검증 요건을 충족했습니다.':'현재는 고규격 요건에 미달해 검사비를 내도 기존 단가가 적용됩니다.',17:f.longSale?'장기 공급 계약이 가격 하락을 완충합니다.':'현물 판매이므로 하락 가격의 영향을 직접 받습니다.',18:supportEligible(s)?'현재 조건을 충족해 신청하면 지원을 받을 수 있습니다.':'현재 조건 미달로 신청해도 지원금은 지급되지 않습니다.',19:f.longCollection?'장기 회수 계약으로 입고 일정이 확정됐습니다.':'단기 계약의 마지막 조정비가 추가됩니다.',20:'현재 회수 인정은 '+round(s.credit)+'점이며 전체 상한은 800점입니다.'};return {...e,description:e.description+(notes[e.id]?' '+notes[e.id]:''),options:e.options.map(x=>({...x}))};}
// 순수 효과 계산: 투자 즉시 부담과 이후 처리 때 실현되는 효과를 구분합니다.
function calculateEffect(s,c,detail=true){const id=s.step+1,left=c===0,f={...s.flags},d={revenue:0,sales:0,grants:0,cost:0,input:0,credit:0,carbon:0,processed:0,inventory:0,soldUnits:0,producedUnits:0,units:{water:0,chemical:0,consumable:0,equipment:0}},delayed=[],immediateDetails=[];let reason='',future='이번 효과는 이 기록에 한 번만 반영됩니다.';
const note=(sourceEventId,text)=>{if(detail){if(sourceEventId<id)delayed.push({sourceEventId,text});else immediateDetails.push(text);}};
const add=(cost,carbon,u)=>{d.cost+=cost;d.carbon+=carbon;if(u)Object.keys(u).forEach(k=>d.units[k]+=u[k]);};
const sell=(u,p)=>{u=round(u);d.inventory-=u;d.soldUnits+=u;d.sales+=round(u*p);d.revenue+=round(u*p);};
const batch=(kg,o={})=>{const q=kg/250,external=!!o.external,h=!!f.hybrid;let cost=(h?100:108)*q,carbon=(h?355:110)*q,water=(h?10:24)*q,chemical=(h?7:15)*q,consumable=6*q,credit=(h?.34:.40)*kg,product=kg*(h?.54:.58);
if(!f.precise&&!h){cost+=24*q;carbon+=32*q;chemical+=5*q;note(8,'기본 진단 뒤 필요한 협력 보완 작업의 비용·부담을 포함했습니다.');}
if(f.precise){cost-=8*q;credit+=.035*kg;product+=.02*kg;note(8,'정밀 진단으로 재작업비를 줄이고 회수 성과를 높였습니다.');}
if(f.flex){cost-=5*q;consumable-=q;note(2,'유연한 설비로 포장·상태 차이의 재작업과 보조재가 줄었습니다.');}else{cost+=5*q;consumable+=2*q;}
if(!external){cost+=(f.own?5:33)*q;note(1,f.own?'자체 시설의 낮은 후속 이용료를 적용했습니다.':'임차·협력 시설 이용료를 처리비에 포함했습니다.');if(f.automated){cost-=20*q;carbon-=18*q;consumable-=2*q;note(9,'자동화 설치 이후 반복 작업비·배출·보조재가 감소했습니다.');}else cost+=12*q;
if(f.circularChem){const saved=chemical*.62;chemical-=saved;cost-=saved*1.8;carbon+=8*q;note(12,'약품 순환으로 신규 투입·구매비를 줄이고 재생 운전 배출은 더했습니다.');}
if(f.reuseWater){water*=.30;carbon+=5*q;cost-=3*q;note(14,'공정수 재이용으로 신규 용수를 줄이고 정화 운전 부담을 포함했습니다.');}}

<section><h3>확인한 공정 원리</h3><p><strong>NCM</strong>은 니켈·코발트·망간을 사용하는 리튬이온 배터리 양극재 계열입니다. 자료에 따라 같은 계열을 NMC로 표기하기도 합니다. 게임은 이 계열의 대표 원료만 다루며 제조사별 포장과 상태 차이를 단순화합니다.</p><p><strong>건식·습식 결합 경로</strong>는 열을 이용한 금속 회수 뒤 추가 회수와 정제가 이어지는 경로입니다. 가열 한 번으로 배터리용 재료가 완성되는 것은 아닙니다. <strong>전처리·습식 중심 경로</strong>도 분류·전처리, 물질 분리·회수·정제와 물·폐수 관리가 함께 필요합니다.</p><p><strong>직접 재활용</strong>은 양극재의 구조와 조성을 살려 다시 쓰려는 접근입니다. 조성과 상태를 아는 적합 원료, 분리 순도, 검증 역량이 중요합니다. 게임에서는 일부 물량으로만 시도하며 준비 상태에 따라 성과가 달라집니다. 산업 원리를 설명하며 실험 절차나 약품 제조법은 제공하지 않습니다.</p></section>

['HHH','다시 돌아오는 공장의 약속','자체 설비에 무게를 둔 운영이 세 성과를 고르게 끌어올렸습니다. 순이익을 확보하는 판단과 배출·자원 부담을 줄이는 판단이 이번 과업에서 잘 맞물렸습니다. 이 설계를 다른 규모에서도 유지할 수 있는지는 별도의 질문으로 남습니다.','순환을 잇는 동행','협력망에 무게를 둔 운영으로 경제성과 두 환경 성과가 모두 상위 구간에 들었습니다. 다른 사업자의 처리 부담까지 포함한 결과라는 점에서 의미가 있습니다. 다음 계약에서도 품질과 환경 조건이 유지되는지가 이어갈 과제입니다.'],
['HHM','가벼워진 발자국의 공장','순이익과 탄소 성과는 좋지만 자원순환은 중간 구간에 머물렀습니다. 자체 운영에서 에너지 부담을 낮추는 판단이 원료 회수까지 모두 해결하지는 못했습니다. 남은 투입과 회수 인정 내역을 나란히 읽을 차례입니다.','가볍게 연결된 생산선','협력망의 순이익과 탄소 성과가 함께 좋은 결과를 냈습니다. 다만 원료를 다시 쓰게 하는 효과는 중간 수준입니다. 다음 협력 조건에서는 처리 비용뿐 아니라 회수 성과를 어떻게 확인할지 비교할 수 있습니다.'],
['HHL','작은 배출, 큰 자원 숙제','자체 설비 중심 사업은 돈을 남기는 성과와 탄소 관리에서 앞섰습니다. 그러나 순자원 부담은 상대적으로 큽니다. 탄소가 적다는 한 문장만으로 이 공장의 순환 성과까지 설명할 수는 없었습니다.','계약서에 남은 원료의 빈칸','경제성과 탄소 성과가 좋은 협력망을 만들었지만 자원순환 성과는 하위 구간입니다. 처리를 맡길 상대와 에너지 조건을 잘 골라도 회수 인정 효과가 충분해지는 것은 아닙니다. 다음 계약의 질문은 회수의 양과 질입니다.'],
['HMH','돌아온 자원이 지키는 장부','자체 설비 중심 운영에서 순이익과 자원순환이 함께 좋은 성과를 냈습니다. 탄소 성과는 중간 구간이어서 자원을 되돌리는 과정의 에너지 부담도 남았습니다. 다음 비교에서는 같은 회수 수준을 더 적은 배출로 유지할 수 있는지 살펴보세요.','가치를 나누어 돌려준 협력망','협력망은 회수 성과와 순이익을 함께 확보했습니다. 탄소 성과는 중간에 놓여, 자원이 돌아온다는 사실만으로 배출 문제까지 해결되지 않았습니다. 협력 공정의 에너지 조건을 바꿨을 때의 대가가 다음 질문입니다.'],
['HMM','다음 개선을 기다리는 여유','경제성에서 앞선 자체 운영이 개선을 이어갈 여지를 만들었습니다. 탄소와 자원순환은 모두 중간 구간이어서 어느 쪽에 여유를 쓸지 선택해야 합니다. 이번에 돈이 남은 원인을 확인해야 다음 투자도 설명할 수 있습니다.','잘 굴러가는 계약의 다음 장','협력망 중심 운영의 경제성은 좋았고 두 환경 성과는 중간 구간입니다. 안정적으로 이어갈 기반과 개선할 여지가 함께 보입니다. 다음에는 환경 조건을 강화한 협력 계약의 비용이 어느 정도인지 비교해볼 수 있습니다.'],
['HML','수익 뒤에 남은 원료 계산서','자체 운영에서 경제성은 좋았지만 자원순환은 상대적으로 약했습니다. 탄소 성과도 중간에 있어, 수익만으로는 어느 환경 부담을 먼저 개선해야 할지 알 수 없습니다. 투입 부담이 큰지 회수 인정 효과가 작은지 기록에서 나눠 보세요.','잘 팔렸지만 덜 돌아왔다','협력망의 경제성은 상위 구간이지만 자원순환 성과는 하위 구간입니다. 탄소 성과는 중간이라 거래 성과와 환경 성과가 서로 다른 이야기를 합니다. 판매 조건을 지킨 채 회수 조건을 높이는 비교가 필요합니다.'],
['HLH','뜨거운 회수의 역설','순이익과 자원순환은 좋았지만 자체 운영의 누적 배출은 상대적으로 컸습니다. 재료를 돌려보내는 과정에도 열·전력과 처리가 필요하다는 대가가 드러났습니다. 회수를 포기하기 전에 에너지 조건을 바꿀 여지가 있는지 확인해보세요.','자원은 돌아왔고 배출은 남았다','협력망은 자원 회수와 경제성에서 좋은 결과를 냈습니다. 하지만 위탁 부담까지 더한 탄소 성과는 하위 구간입니다. 사업장 밖에서 일어난 배출도 이 순환의 일부라는 사실이 장부에 남았습니다.'],
['HLM','남는 돈과 남겨진 탄소','자체 설비 중심 사업의 경제성은 좋지만 탄소 성과는 낮습니다. 자원순환도 중간 구간이라 높은 수익이 환경 개선을 보증하지는 않았습니다. 같은 판매 전략을 두고 에너지 선택만 바꾸면 무엇이 달라지는지 비교할 수 있습니다.','경계 밖까지 이어진 탄소 장부','협력망의 좋은 경제성 옆에 상대적으로 큰 누적 배출이 남았습니다. 자원순환은 중간 구간이며, 외주를 선택해도 환경 부담이 사라지지 않았습니다. 다음에는 협력 공정의 배출 조건도 가격처럼 따져볼 차례입니다.'],
['HLL','이익만으로 닫히지 않는 순환','자체 운영의 경제성은 앞섰지만 탄소와 자원순환 성과는 모두 하위 구간입니다. 처리 과업은 끝났어도 환경적 대가가 작지는 않았습니다. 돈을 남긴 선택 중 어떤 것을 바꾸면 두 부담을 함께 줄일 수 있을지 기록이 질문을 던집니다.','잘 돌아가는 사업, 무거운 발자국','협력망은 경제성에서 성과를 냈지만 두 환경 성과가 뒤따르지 못했습니다. 계약과 위탁만으로 자원순환의 질이 저절로 높아지지는 않았습니다. 협력망을 유지하면서 조건을 바꾸는 실험이 다음 플레이가 될 수 있습니다.'],
['MHH','수익보다 먼저 도착한 전환','자체 설비 중심 운영은 탄소와 자원순환에서 좋은 성과를 냈고 경제성은 중간 구간입니다. 환경 부담을 줄인 선택이 이어갈 수 있는 사업 조건까지 갖췄는지 살펴볼 시점입니다. 초기 비용과 이후 효과를 나누어 보면 조정할 곳이 보입니다.','함께 줄인 부담, 남은 계약 과제','협력망의 탄소·자원순환 성과는 좋고 경제성은 중간 구간입니다. 환경적 조건을 충족하는 연결이 만들어졌지만 비용과 판매 조건에는 개선 여지가 있습니다. 회수 수준을 유지하면서 계약 조건을 바꿔 비교해볼 수 있습니다.'],
['MHM','조용히 줄어든 공장의 배출','자체 운영의 강점은 탄소 성과입니다. 경제성과 자원순환은 중간 구간이어서 적은 배출만으로 운영 전체가 완성되지는 않았습니다. 다음에는 회수·정제 강화의 비용과 자원 효과를 함께 따져볼 수 있습니다.','적은 배출로 연결된 다음 기회','협력망의 탄소 성과는 좋고 경제성·자원순환은 중간에 놓였습니다. 같은 과업을 더 적은 배출로 수행했지만 원료를 다시 쓰는 성과에는 여유가 있습니다. 협력망의 장점을 지키며 회수 조건을 조정할 가능성이 남았습니다.'],
['MHL','낮춘 배출 옆의 빈 회수 상자','자체 운영은 탄소 관리에서 앞섰지만 자원순환은 하위 구간입니다. 경제성이 중간에 놓여 회수 개선 비용을 얼마나 감수할지도 고민해야 합니다. 배출이 적은 공정과 자원을 잘 돌려주는 공정은 같은 말이 아니었습니다.','가벼운 이동, 무거운 자원 부담','협력망에서 탄소 성과는 좋지만 자원순환 성과가 약했습니다. 경제성은 중간 구간으로, 가격 조건만 강화해도 회수 문제가 해결되지는 않습니다. 다음 비교에서는 회수 인정 효과와 추가 투입의 차이를 먼저 살펴보세요.'],
['MMH','돌아온 재료가 남긴 가능성','자체 운영은 자원순환에서 좋은 성과를 냈습니다. 경제성과 탄소 성과는 중간 구간이어서, 이 회수 수준을 더 낮은 비용과 배출로 유지하는 것이 다음 과제입니다. 무엇을 더 회수했는지보다 그 과정에 무엇을 썼는지도 함께 읽어야 합니다.','회수의 약속을 지킨 연결','협력망 중심 운영의 강점은 자원순환 성과입니다. 경제성과 탄소는 중간 구간에 있어 회수 결과를 유지하면서 계약·에너지 조건을 다듬을 여지가 있습니다. 자원을 돌아오게 한 협력 조건을 먼저 확인해보세요.'],
['MMM','세 갈래 사이의 첫 설계','자체 설비 중심 운영의 세 성과가 모두 중간 구간에 놓였습니다. 한쪽에 치우치지 않았지만 뚜렷한 강점을 만들 여지도 남았습니다. 다음에는 한 가지 선택만 바꾸어 장부의 변화가 어디서 시작되는지 관찰해보세요.','아직 열려 있는 협력 지도','협력망의 세 성과가 모두 중간 구간입니다. 처리 과업을 마친 지금은 연결을 늘리기보다 어떤 계약 조건이 중요한지 확인할 차례입니다. 한두 선택을 바꾼 재플레이가 경제성과 환경성의 관계를 더 선명하게 보여줄 수 있습니다.'],
['MML','끝난 처리와 남은 순환','자체 운영은 경제성과 탄소에서 중간 성과를 냈지만 자원순환은 하위 구간입니다. 처리 완료와 높은 회수 성과가 서로 다르다는 점이 드러났습니다. 다음에는 추가 회수의 부담이 인정 효과보다 작은 구간을 찾아볼 수 있습니다.','맡긴 물량 뒤에 남은 과제','협력망은 과업을 끝냈고 경제성과 탄소는 중간 구간에 놓였습니다. 하지만 자원순환 성과는 낮아 완료 보고만으로는 충분하지 않았습니다. 회수의 실제 결과를 확인하는 협력 조건이 다음 비교의 출발점입니다.'],
['MLH','되찾은 원료의 에너지 영수증','자체 운영의 자원순환 성과는 좋지만 탄소 성과는 낮습니다. 경제성은 중간에 있어, 회수를 이어갈 때 에너지 비용과 배출을 함께 다뤄야 합니다. 자원을 되찾는 데 필요한 부담이 이번 설계의 핵심 질문으로 남았습니다.','돌아오는 자원길의 탄소 비용','협력망은 높은 자원순환 성과를 냈지만 탄소에서는 하위 구간입니다. 경제성도 중간에 놓여 회수와 비용을 모두 지키는 개선이 필요합니다. 협력 공정까지 포함해 에너지 사용을 비교해야 다음 선택의 이유를 설명할 수 있습니다.'],
['MLM','돌아가는 공장의 뜨거운 질문','경제성과 자원순환은 중간이지만 자체 운영의 탄소 성과는 낮습니다. 처리 과업을 이어갈 힘과 배출을 줄이는 힘은 같지 않았습니다. 다음에는 기존 전략을 유지한 채 저탄소 전력이나 공정 조건의 영향을 따로 비교해보세요.','연결은 되었지만 배출은 커졌다','협력망의 경제성과 자원순환은 중간 구간에 머물렀고 탄소 성과는 낮습니다. 여러 곳을 연결하는 운영도 운송과 공정 부담을 안고 있습니다. 어디에서 발생한 배출이 큰지 기록을 나누어 보는 것이 다음 개선의 시작입니다.'],
['MLL','다음 설계가 필요한 작업대','자체 운영은 경제성에서 중간 구간에 들었지만 두 환경 성과는 하위 구간입니다. 과업을 끝냈다는 성과와 앞으로 줄여야 할 부담이 함께 남았습니다. 원가를 유지하면서 환경 부담을 줄인 선택이 있었는지 실제 기록에서 찾아보세요.','완료 도장 뒤의 두 숙제','협력망은 처리 과업을 마쳤지만 탄소와 자원순환 성과는 낮았습니다. 경제성은 중간이어서 환경 조건을 높이는 대가도 살펴야 합니다. 다음에는 위탁 여부만이 아니라 위탁과 회수의 조건을 함께 비교해볼 수 있습니다.'],
['LHH','환경 성과를 지킬 사업 조건','자체 운영의 탄소·자원순환 성과는 좋지만 경제성은 하위 구간입니다. 필요한 환경 개선을 했다는 사실과 그 운영을 계속할 수 있다는 사실은 별개입니다. 회수를 줄이기 전에 초기 투자 배분과 판매 조건을 다시 비교해볼 만합니다.','좋은 순환을 이어갈 가격','협력망은 두 환경 성과에서 앞섰지만 경제성이 뒤따르지 못했습니다. 이 협력을 지속하려면 환경 조건을 유지하면서 비용을 나누고 가치를 인정받는 방법이 필요합니다. 계약과 품질 판로가 다음 재플레이의 중요한 비교 대상입니다.'],

 ['자원은 투입과 회수를 함께 봅니다','투입 '+n(d.input)+' − 회수 인정 '+n(d.credit)+' = 순자원 부담 '+signed(d.resource)+'점',t.resource],

].map(([title,formula,why],i)=>'<div class="learning-step"><span class="learning-number">'+(i+1)+'</span><div><h4>'+title+'</h4><p>'+esc(why)+'</p><div class="learning-formula">'+esc(formula)+'</div></div></div>').join('')+'</div>';}
function naturalDiff(d){return [['money','번 돈','만원'],['carbon','탄소 배출','kg CO₂e'],['resource','순자원 부담','점']].map(([k,label,unit])=>{const v=E.round(d[k]);return label+(v===0?'은 같았습니다.':'은 '+n(Math.abs(v))+unit+(v>0?' 더 많았습니다.':' 더 적었습니다.'));}).join(' ');}
function causeForImpact(item){const d=item.diff,b=E.CONFIG.scoreBounds;const key=['money','carbon','resource'].sort((x,y)=>{const range=k=>b[k==='money'?'economy':k][1]-b[k==='money'?'economy':k][0];return Math.abs(d[y])/range(y)-Math.abs(d[x])/range(x);})[0];const t=T.explain(item.before,path[item.index]);return t[key];}
function resultReading(ev){return '<section class="content-card result-reading"><h2>이번 결과, 이렇게 읽으면 됩니다</h2><p>같은 배터리 1,000kg을 모두 처리했습니다. 이제 <strong>돈을 남겼는지, 그 과정에서 얼마나 배출했는지, 자원 부담을 얼마나 줄였는지</strong>를 따로 살펴보세요.</p><div class="reading-grid"><div><h3>① 사업을 이어갈 돈</h3><p>'+esc(game.money>=0?'비용을 모두 빼고 '+n(game.money)+'만원이 남았습니다.':'수입보다 비용이 '+n(Math.abs(game.money))+'만원 많아 적자입니다.')+' 이 금액은 투자금이나 대출을 더한 값이 아닙니다.</p></div><div><h3>② 처리를 위해 배출한 양</h3><p>실제로 '+n(game.carbon)+'kg CO₂e를 배출했습니다. 탄소 점수 '+n(ev.scores.carbon)+'점은 같은 과업의 다른 경로보다 배출을 얼마나 낮췄는지 나타냅니다. 점수가 높아도 배출이 없었다는 뜻은 아닙니다.</p></div><div><h3>③ 자원을 되찾은 효과</h3><p>투입 '+n(game.input)+'점에서 회수 인정 '+n(game.credit)+'점을 뺀 '+n(game.resource)+'점입니다. '+(game.resource<0?'음수는 게임의 회수 인정 효과가 투입 부담보다 컸다는 뜻입니다.':'양수는 회수 인정으로 상쇄하고도 투입 부담이 남았다는 뜻입니다.')+' 낮을수록 유리합니다.</p></div></div><p class="reading-takeaway">세 점수의 평균만 보지 말고, 가장 낮은 항목 하나를 다음 비교의 출발점으로 삼아 보세요.</p></section>';}

function retryRoute(an){const next=path.slice();next[an.alternative.index]=1-next[an.alternative.index];const s=S.replay(next);return '<details class="retry-route"><summary>다음 게임의 선택 순서 보기 · 한 곳만 변경</summary><p>이번 순서에서 '+(an.alternative.index+1)+'회만 바꿨습니다. 다른 전략을 함께 바꾸면 아래 예상 결과와 달라질 수 있습니다.</p><ol>'+s.history.map((e,i)=>'<li'+(i===an.alternative.index?' class="changed-choice"':'')+'>'+esc(e.label)+(i===an.alternative.index?' <strong>← 여기만 변경</strong>':'')+'</li>').join('')+'</ol></details>';}

function retryPlan(an){const alt=an.alternative,ev=an.actual,k=an.weakest,diff={money:alt.state.money-game.money,carbon:alt.state.carbon-game.carbon,resource:alt.state.resource-game.resource},gain=alt.evaluation.scores[k]-ev.scores[k];const before=S.replay(path.slice(0,alt.index)),t=T.explain(before,1-path[alt.index]);return '<div class="content-card retry-plan"><div class="eyebrow">한 가지만 바꾸는 비교 실험</div><h2>다음 게임에서는 이렇게 해 보세요</h2><p><strong>목표: '+labels[k]+'를 먼저 살펴보기</strong><br>이번 세 점수 중 '+labels[k]+'가 '+n(ev.scores[k])+'점으로 가장 낮았습니다.</p><ol class="retry-steps"><li><b>다른 선택은 그대로 유지하세요.</b> 한 가지만 바꿔야 무엇 때문에 달라졌는지 알기 쉽습니다.</li><li><b>'+ (alt.index+1)+'회에서 바꿉니다.</b><br>이번: '+esc(alt.entry.label)+'<br>다음: <strong>'+esc(alt.alternative)+'</strong></li><li><b>이유를 먼저 예상해 보세요.</b><br>'+esc(t.process)+' '+esc(k==='economy'?t.money:k==='carbon'?t.carbon:t.resource)+'</li></ol><h3>같은 나머지 선택을 유지하면</h3><table class="compact-table retry-table"><thead><tr><th>항목</th><th>이번</th><th>한 선택을 바꾼 뒤</th></tr></thead><tbody>'+[['money','번 돈','만원'],['carbon','탄소 배출','kg CO₂e'],['resource','순자원 부담','점']].map(([key,label,unit])=>'<tr><td>'+label+'</td><td>'+n(game[key])+unit+'</td><td>'+n(alt.state[key])+unit+'</td></tr>').join('')+'</tbody></table><p class="retry-tradeoff">'+esc(naturalDiff(diff))+'</p><p>'+labels[k]+' 점수는 '+n(ev.scores[k])+' → '+n(alt.evaluation.scores[k])+'점입니다. '+(gain>0?'이 항목이 좋아지는 대신 다른 부담이 늘어나는지도 위 표에서 확인하세요.':'이번 경로에서는 한 선택만 바꿔 이 항목을 더 높이는 대안을 찾지 못했습니다. 개선이 보장되는 처방이 아니라 다른 대가를 확인하는 비교로 활용하세요.')+'</p><p class="muted">플레이한 뒤 “예상과 같았나?”, “좋아진 항목의 대가는 무엇이었나?”를 한 문장씩 적어 보세요. 이 비교는 현재 게임 모델의 결과입니다.</p>'+retryRoute(an)+'</div>';}

function eventScreen(){if(phase==='feedback')return feedback();if(game.step>=20)return result();const ev=E.getEvent(game);return `${track(ev.id)}<div class="event-top"><span class="eyebrow" style="margin:0">${esc(typeof ev.stage==='string'?ev.stage:stages.find(x=>ev.id<=x[2])[0])}</span><span class="event-counter"><strong>${ev.id}</strong> / 20</span></div><h2>${esc(ev.title)}</h2><div class="event-layout"><p class="event-description">${esc(ev.description)}</p><aside class="term"><b>알아두면 좋은 말</b>${esc(typeof ev.term==='object'?`${ev.term.title||''} ${ev.term.description||ev.term.text||''}`:ev.term)}</aside></div><div class="scene">${A.scene(ev.id,game)}</div>${previewChoices(ev)}<div class="choice-foot"><span>두 선택 모두 안전·환경 기준을 지키는 방식입니다.</span><span>현재 처리 ${n(game.processed)} / 1,000kg</span></div>`;}
function deltaCards(d){return `<div class="delta-grid">${[['money','번 돈','만원'],['resource','사용한 자원 포인트','점'],['carbon','배출한 탄소의 양','kg CO₂e']].map(([key,title,unit])=>`<div class="delta-card"><span>${title}</span><strong class="${trend(d[key],key)}">${signed(d[key])}<small>${unit}</small></strong></div>`).join('')}</div>`;}
function feedback(){const entry=game.history.at(-1);if(!entry)return eventScreen();const before=S.replay(path.slice(0,entry.eventId-1)),lesson=T.explain(before,entry.choiceIndex);return `${track(entry.eventId)}<section class="feedback-card reveal"><div class="feedback-heading"><div class="eyebrow">${entry.eventId} / 20 · 선택의 결과</div><h2>${esc(entry.label)}</h2></div><div class="feedback-body"><div class="scene">${A.scene(entry.eventId,game,entry)}</div>${deltaCards(entry.delta)}<div class="explanation"><h3>실제로 일어난 일</h3><ul>${entry.immediate.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${learningExplanation(before,entry.choiceIndex,entry)}${entry.delayed.length?`<div class="delayed"><strong>이전 선택이 지금 영향을 주었습니다</strong><ul>${entry.delayed.map(d=>`<li>${d.sourceEventId?`${d.sourceEventId}회 선택 → `:''}${esc(d.text||d)}</li>`).join('')}</ul></div>`:''}<div class="future"><strong>앞으로 이어지는 조건</strong><br>${esc(lesson.later)}</div><div class="feedback-bottom"><span>지금까지 ${n(game.processed)}kg 처리 · 이번 변화는 한 번만 반영되었습니다.</span><button class="primary" data-action="next">${game.step===20?'최종 평가 확인':'다음 결정'} <span class="arrow">→</span></button></div></div></section>`;}
function summary(){return `<div class="summary-grid"><div class="summary-item"><small>번 돈 · 누적 순이익</small><strong>${n(game.money)}만원</strong><p>총매출 ${n(game.revenue)} − 총비용 ${n(game.cost)}만원<br>판매 ${n(game.sales)} · 성과 지원 ${n(game.grants)}만원</p></div><div class="summary-item"><small>배출한 탄소의 양</small><strong>${n(game.carbon)}<small> kg CO₂e</small></strong><p>이미 배출한 양 · 소급 차감 없음</p></div><div class="summary-item"><small>사용한 자원 포인트</small><strong>${n(game.input-game.credit)}<small>점</small></strong><p>투입 ${n(game.input)} − 회수 인정 ${n(game.credit)}점</p></div></div>`;}
function analyses(){const key=path.join('');if(analysisCache?.key===key)return analysisCache;const actual=E.evaluate(game);const items=path.map((c,i)=>{const other=path.slice();other[i]=1-c;const s=S.replay(other);const e=E.evaluate(s);let before=E.initialState();for(let j=0;j<i;j++)before=E.applyChoice(before,path[j],true);const option=E.getEvent(before).options[1-c];const diff={money:game.money-s.money,carbon:game.carbon-s.carbon,resource:game.input-game.credit-(s.input-s.credit)};const weight=['economy','carbon','resource'].reduce((a,k)=>a+Math.abs(actual.scores[k]-e.scores[k]),0);return {before,index:i,entry:game.history[i],alternative:option.label,state:s,evaluation:e,diff,weight};}).sort((a,b)=>b.weight-a.weight||a.index-b.index);const weakest=Object.keys(labels).sort((a,b)=>actual.scores[a]-actual.scores[b])[0];const alternative=[...items].sort((a,b)=>b.evaluation.scores[weakest]-a.evaluation.scores[weakest])[0];return analysisCache={key,items,top:items.slice(0,3),weakest,alternative,actual};}
function strengthText(ev){const keys=Object.keys(labels).sort((a,b)=>ev.scores[b]-ev.scores[a]);const k=keys[0];return `${labels[k]}가 세 항목 중 가장 높은 ${n(ev.scores[k])}점입니다. ${k==='economy'?`매출 ${n(game.revenue)}만원과 비용 ${n(game.cost)}만원의 차이가 ${n(game.money)}만원으로 남았습니다.`:k==='carbon'?`고정 과업 1,000kg을 처리하면서 실제 배출을 ${n(game.carbon)}kg CO₂e로 관리했습니다.`:`투입 ${n(game.input)}점에 대해 회수 인정 ${n(game.credit)}점을 확보했습니다.`}`;}
function limitationText(ev){const k=Object.keys(labels).sort((a,b)=>ev.scores[a]-ev.scores[b])[0];return `${labels[k]}는 ${n(ev.scores[k])}점으로 상대적으로 낮습니다. ${k==='economy'?'투자 비용은 이번 과업에서 모두 비용으로 반영하므로, 다음 과업까지 운영한다면 경제성 해석은 달라질 수 있습니다.':k==='carbon'?'금속을 회수했다는 이유로 이미 발생한 운송·공정·환경 처리 배출이 사라지지는 않습니다.':'회수 인정 효과만 보지 말고 설비·용수·약품·소모품의 투입 부담도 함께 살펴야 합니다.'} 이 점수는 교육용 모델 내 비교이며 산업의 실제 성적표는 아닙니다.`;}
function result(){const ev=E.evaluate(game),ending=C.endings[ev.endingId],an=analyses();const alt=an.alternative;return `<div class="page-top"><span class="pill">20 / 20 완료 · ${n(game.processed)} / 1,000kg 처리</span><button class="back" data-route="collection">결말 도감 보기 ↗</button></div><section class="result-hero"><div><div class="eyebrow">당신이 만든 자원의 다음 장</div><h1>${esc(ending.title)}</h1><p>${esc(ending.story)}</p></div><div class="total-score"><small>종합점수 · 동일 가중치</small><strong>${n(ev.scores.total)}</strong><small>100점 만점</small></div></section><div class="score-grid">${Object.keys(labels).map(k=>`<div><div class="score-head"><span>${labels[k]}</span><b>${n(ev.scores[k])}<small> / 100</small></b></div><div class="score-track"><span style="width:${ev.scores[k]}%"></span></div><div class="score-note">${grade[ev.grades[k]]} · 총점의 ⅓</div></div>`).join('')}</div>${summary()}${resultReading(ev)}<div class="badge-row"><span class="pill">${modes[ev.mode]}</span><span class="pill">1kg당 ${n(game.carbon/1000)}kg CO₂e</span><span class="pill">1kg당 ${n((game.input-game.credit)/1000)} 자원 포인트</span><span class="pill">${Object.keys(unlocked).length} / 54 결말 기록</span></div><div class="analysis-grid"><section class="content-card"><h2>결과를 크게 바꾼 선택 3개</h2><p class="muted">실제로 고른 선택 중 결과 차이가 큰 세 가지입니다. 각 선택 하나만 바꾸고 나머지는 그대로 두어 비교했습니다. “더 적다·더 많다”를 지표별로 읽어 보세요. 선택끼리 연결되어 있으므로 세 차이를 합산하지 않습니다.</p>${an.top.map(item=>`<article class="impact"><h3>${item.index+1}회 · ${esc(item.entry.label)}</h3><p>${esc(T.explain(item.before,path[item.index]).process)}</p><p>${esc(causeForImpact(item))}</p><p class="comparison"><strong>다른 선택을 했다면 어땠을까요?</strong><br>나머지는 그대로 두고 두 선택을 비교한 최종 차이입니다. 이번 선택을 했을 때 ${esc(naturalDiff(item.diff))}</p></article>`).join('')}</section><section><div class="content-card"><h2>이번 전략 읽기</h2><h3>장점</h3><p>${esc(strengthText(ev))}</p><h3>한계</h3><p>${esc(limitationText(ev))}</p></div>${retryPlan(an)}</section></div><section class="content-card"><h2>내 결과 기록하기</h2><p>시연 후 선택 근거와 수치를 함께 설명해 보세요. 복사가 제한되면 아래 텍스트를 직접 선택하거나 파일로 저장할 수 있습니다.</p><div class="actions"><button class="primary" data-action="copy">결과 복사</button><button class="secondary" data-action="download">텍스트로 저장</button><button class="quiet" data-route="ledger">전체 계산 기록</button></div><details><summary>결과 텍스트 직접 선택하기</summary><textarea class="copy-box" aria-label="최종 결과 텍스트" readonly>${esc(resultText())}</textarea></details></section><div class="actions"><button class="primary" data-action="new">다른 선택으로 다시 시작 <span class="arrow">→</span></button><button class="secondary" data-route="model">점수와 모델 살펴보기</button></div>`;}
function resultText(){const ev=E.evaluate(game),an=analyses(),ending=C.endings[ev.endingId];return `다시, 자원이 되기까지 — 플레이 결과\n${ending.title}\n${ending.story}\n\n처리 과업: ${game.processed}/1000kg NCM 사용 후 배터리\n선택: ${path.map(x=>x+1).join('·')} (1=첫 번째, 2=두 번째)\n운영 방식: ${modes[ev.mode]}\n번 돈: ${n(game.money)}만원\n총매출: ${n(game.revenue)}만원 (산물 판매 ${n(game.sales)}, 성과 지원수익 ${n(game.grants)}) / 총비용: ${n(game.cost)}만원\n배출한 탄소의 양: ${n(game.carbon)}kg CO₂e\n사용한 자원 포인트: ${n(game.input-game.credit)}점 (투입 ${n(game.input)} − 회수 인정 ${n(game.credit)})\n경제성 ${n(ev.scores.economy)} / 탄소 ${n(ev.scores.carbon)} / 자원순환 ${n(ev.scores.resource)} / 종합 ${n(ev.scores.total)}점\n\n결과를 크게 바꾼 실제 선택\n${an.top.map(x=>`${x.index+1}회 ${x.entry.label}: ${T.explain(x.before,path[x.index]).process} ${causeForImpact(x)}\n다른 선택과 비교: 순이익 ${signed(x.diff.money)}만원, 탄소 ${signed(x.diff.carbon)}kg CO₂e, 순자원 부담 ${signed(x.diff.resource)}점`).join('\n\n')}\n\n장점: ${strengthText(ev)}\n한계: ${limitationText(ev)}\n다음 비교: 다른 선택은 유지하고 ${an.alternative.index+1}회만 ${an.alternative.alternative}로 바꾸기\n예상 결과: 번 돈 ${n(an.alternative.state.money)}만원 / 탄소 ${n(an.alternative.state.carbon)}kg CO₂e / 순자원 부담 ${n(an.alternative.state.resource)}점\n점수 ${n(ev.scores[an.weakest])} → ${n(an.alternative.evaluation.scores[an.weakest])}\n이유: ${T.explain(S.replay(path.slice(0,an.alternative.index)),1-path[an.alternative.index]).process}\n\n모든 수치는 교육용 가정입니다. 실제 산업 예측이나 책의 직접 인용이 아닙니다.\n\n전체 선택·계산 기록\n${game.history.map(x=>`${x.eventId}. ${x.label} | 매출 ${n(x.delta.revenue)}, 비용 ${n(x.delta.cost)}만원 | 자원 투입 ${n(x.delta.input)}, 회수 인정 ${n(x.delta.credit)}점 | 탄소 ${n(x.delta.carbon)}kg CO₂e\n근거: ${T.explain(S.replay(path.slice(0,x.eventId-1)),x.choiceIndex).process} ${T.explain(S.replay(path.slice(0,x.eventId-1)),x.choiceIndex).money}\n지연 효과: ${x.delayed.map(d=>`${d.sourceEventId}회 ${d.text}`).join(' / ')||'없음'}`).join('\n\n')}`;}
function ledger(){return `<div class="content-page">${back()}<div class="eyebrow">장부는 한 번만 기록합니다</div><h1>계산 기록</h1><p class="muted">설명 확인·새로고침·화면 이동은 수치를 바꾸지 않습니다. 모든 금액은 만원, 자원은 가중 포인트입니다.</p>${summary()}<div class="formula">번 돈 ${n(game.money)} = 누적 총매출 ${n(game.revenue)} − 누적 비용 ${n(game.cost)}<br>총매출 ${n(game.revenue)} = 산물 판매 ${n(game.sales)} + 성과 지원수익 ${n(game.grants)}<br>사용한 자원 포인트 ${n(game.input-game.credit)} = 투입 ${n(game.input)} − 회수 인정 ${n(game.credit)}<br>배출한 탄소의 양 ${n(game.carbon)}kg CO₂e = 각 기록의 실제 배출 합계</div><div class="ledger-list">${game.history.length?game.history.map(e=>`<article class="ledger-entry"><h3>${e.eventId}. ${esc(e.title)} → ${esc(e.label)}</h3><div class="ledger-numbers"><div><span>총매출 / 비용</span>${n(e.delta.revenue)} / ${n(e.delta.cost)}만원<br><span>판매 ${n(e.delta.sales)} · 지원 ${n(e.delta.grants)}</span></div><div><span>자원 투입 / 회수 인정</span>${n(e.delta.input)} / ${n(e.delta.credit)}점</div><div><span>실제 탄소 배출</span>+${n(e.delta.carbon)}kg CO₂e</div><div><span>이번 처리량</span>${n(e.delta.processed)}kg</div></div><p><strong>즉시 효과:</strong> ${e.immediate.map(esc).join(' ')}</p><p><strong>계산 근거:</strong> ${esc(e.reason)}</p>${e.delayed.length?`<p><strong>실현된 지연 효과:</strong> ${e.delayed.map(d=>`${d.sourceEventId}회 → ${esc(d.text)}`).join(' / ')}</p>`:''}${e.future?`<p><strong>이후 조건:</strong> ${esc(e.future)}</p>`:''}</article>`).join(''):'<div class="content-card"><p>아직 내린 결정이 없습니다. 첫 선택부터 계산 내역이 남습니다.</p></div>'}</div></div>`;}
function collection(){const keys=Object.keys(C.endings);return `<div class="content-page">${back()}<div class="catalog-header"><div><div class="eyebrow">자원이 돌아오는 54개의 길</div><h1>결말 도감</h1></div><div><span class="big">${Object.keys(unlocked).length}</span><span class="muted"> / 54</span></div></div><p class="muted">같은 과업도 다른 결말에 닿습니다. 확인한 결말은 새 게임을 시작해도 이 브라우저에 남습니다. 아직 만나지 않은 이야기는 가려 두었습니다.</p>${selectedEnding&&unlocked[selectedEnding]?endingDetail(selectedEnding):''}<div class="catalog-grid">${keys.map((id,i)=>{const end=C.endings[id],open=unlocked[id];return open?`<button class="ending-card" data-ending="${id}"><span class="catalog-no">기록 ${String(i+1).padStart(2,'0')} <span>확인함</span></span><h3>${esc(end.title)}</h3><p>${grade[id[0]]} 경제 · ${grade[id[1]]} 탄소<br>${grade[id[2]]} 순환 · ${modes[id.split('-')[1]]}</p></button>`:`<div class="ending-card locked"><span class="catalog-no">기록 ${String(i+1).padStart(2,'0')} <span aria-label="미해금">아직 만나지 않음</span></span><h3>다음 선택이 열어 줄 이야기</h3><p>결말을 확인하면 지표 조합과<br>운영 방식이 공개됩니다.</p></div>`;}).join('')}</div></div>`;}
function endingDetail(id){const e=C.endings[id];return `<article class="ending-detail" id="ending-detail" tabindex="-1"><div class="eyebrow">확인한 결말</div><h2>${esc(e.title)}</h2><div class="badge-row"><span class="pill">경제성 ${grade[id[0]]}</span><span class="pill">탄소 ${grade[id[1]]}</span><span class="pill">자원순환 ${grade[id[2]]}</span><span class="pill">${modes[id.split('-')[1]]}</span></div><p>${esc(e.story)}</p><button class="text-button" data-action="close-ending">설명 접기</button></article>`;}
function eventGuide(){let s=E.initialState();return E.EVENTS.map((_,i)=>{const ev=E.getEvent(s),opts=ev.options.map((o,j)=>{const next=E.applyChoice(s,j,true),d=next.history.at(-1);return `<h3>${j+1}. ${esc(o.label)}</h3><p>${esc(o.hint)}</p><p>순이익 ${signed(d.delta.money)}만원 / 자원 ${signed(d.delta.resource)}점 / 탄소 +${n(d.delta.carbon)}kg CO₂e<br>매출 ${n(d.delta.revenue)}, 비용 ${n(d.delta.cost)}만원 · 투입 ${n(d.delta.input)}, 회수 인정 ${n(d.delta.credit)}점</p><p><strong>근거:</strong> ${esc(d.reason)}<br><strong>이후:</strong> ${esc(d.future)}</p>`;}).join('');s=E.applyChoice(s,i%2,true);return `<details><summary>${i+1}. ${esc(ev.title)}</summary><p>${esc(ev.description)}</p>${opts}</details>`;}).join('');}
function boundsHtml(){const b=E.CONFIG.scoreBounds;if(!b)return '<p>점수 기준은 첨부된 모델 설명서와 엔진의 CONFIG에서 확인할 수 있습니다.</p>';return `<table class="compact-table"><caption>전체 선택 경로에서 실제 도달 가능한 최솟값과 최댓값을 사용합니다.</caption><thead><tr><th>항목</th><th>0점 기준</th><th>100점 기준</th></tr></thead><tbody>${Object.keys(labels).map(k=>`<tr><td>${labels[k]}</td><td>${n(k==='economy'?b[k][0]:b[k][1])}${k==='economy'?'만원':k==='carbon'?'kg CO₂e':'점'}</td><td>${n(k==='economy'?b[k][1]:b[k][0])}${k==='economy'?'만원':k==='carbon'?'kg CO₂e':'점'}</td></tr>`).join('')}</tbody></table><div class="formula">경제성 = (순이익 − 최솟값) ÷ (최댓값 − 최솟값) × 100<br>탄소·자원순환 = (최댓값 − 실제 부담) ÷ (최댓값 − 최솟값) × 100<br>각 점수는 0~100점, 종합점수 = (경제성 + 탄소 + 자원순환) ÷ 3</div><p class="muted">세 항목의 최댓값을 한 경로에서 동시에 얻을 수 있다는 뜻은 아닙니다. 각 항목을 별도로 비교합니다.</p>`;}
function model(){return `<div class="content-page">${back()}<div class="eyebrow">선택 뒤에 놓인 가정들</div><h1>모델과 출처</h1><div class="notice"><strong>모든 금액·탄소·자원 계수는 교육용 가정값입니다.</strong> 이 게임은 실제 사업의 수익이나 배출량을 예측하지 않습니다.</div><section class="content-card">${C.modelHtml}</section><section class="content-card"><h2>자원 가중치와 인정 한도</h2><div id="resource-model">${resourceModel()}</div></section><section class="content-card"><h2>세 성과를 같은 비중으로</h2>${boundsHtml()}${thresholdHtml()}<p>운영 방식은 1·9·19회의 자체 시설·자동화·내부 처리 선택에 각 2점, 12·14회의 자체 순환 설비 선택에 각 1점을 부여합니다. 합계 5점 이상은 자체 설비 중심, 그 미만은 협력망 중심입니다. 한 번의 결정만으로 전체 방식을 정하지 않습니다.</p></section><section class="content-card"><h2>20개 사건과 두 선택의 효과</h2><p>아래는 1번·2번 선택을 번갈아 고른 <strong>고정 참조 경로</strong>의 각 사건 직전 상태에서 두 대안을 계산한 예입니다. 실제 플레이에서는 앞선 선택에 따라 수치와 조건이 바뀝니다. 두 대안을 동시에 합산한 결과가 아닙니다.</p>${eventGuide()}</section><section class="content-card"><h2>확인한 출처</h2>${C.sources.map(s=>`<div class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><p>${esc(s.org)} · ${esc(s.note)}</p></div>`).join('')}</section><section class="content-card"><h2>직접 검토할 질문</h2><ol>${C.reviewQuestions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol><p class="muted">아래 검증은 제작 도구로 수행한 결과입니다. 학생이 직접 조사하거나 검증했다고 쓰지 않고, 실제로 수행한 검토와 구분해 설명하세요.</p>${validationHtml()}</section></div>`;}
function resourceModel(){return E.CONFIG.resourceExplanationHtml||`<p>물·약품·에너지·설비 등 서로 다른 투입을 게임 가중치로 환산합니다. 자원 소비와 회수 인정값은 같은 포인트 척도에서 계산하며, 서로 다른 자원의 kg을 직접 빼지 않습니다.</p><div class="formula">예: 자원 투입 40점 − 실제 처리에서 인정한 회수 55점 = 순자원 부담 −15점</div><p>이 예는 계산법을 위한 예시입니다. 실제 게임의 가중치·회수 한도는 아래 수치 가정과 첨부 모델 설명서에서 확인할 수 있습니다.</p>${E.CONFIG.resourceWeights?`<table class="compact-table"><thead><tr><th>구분</th><th>가중치</th></tr></thead><tbody>${Object.entries(E.CONFIG.resourceWeights).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${typeof v==='object'?esc(JSON.stringify(v)):esc(v)}</td></tr>`).join('')}</tbody></table>`:''}`;}
function thresholdHtml(){const g=E.CONFIG.gradeThresholds;if(!g)return '';return `<h3>결말 성과 구간</h3><p>점수 경계는 실제 경로의 분포를 보고 정한 교육용 기준입니다. 같은 상위 구간이라도 항목별 원래 단위와 경제·환경적 의미는 다릅니다.</p><div class="score-bounds">${Object.entries(g).map(([k,v])=>`${labels[k]||esc(k)}: ${Array.isArray(v)?`${n(v[0])}점 미만 하위 / ${n(v[0])}점 이상 ${n(v[1])}점 미만 중간 / ${n(v[1])}점 이상 상위`:esc(JSON.stringify(v))}`).join('<br>')}</div>`;}
function validationHtml(){const v=globalThis.GameValidation;if(!v)return '<p>전체 검증 수치와 결말별 예시 경로는 동봉된 검증 결과 파일에 있습니다.</p>';return `<div class="formula">탐색한 경로 ${n(v.paths)}개 · 도달 가능한 결말 ${n(v.reachable)}개<br>선택 횟수 20회 · 사건별 선택지 2개 · 고정 처리 1,000kg</div><p>전체 탐색은 개발 단계의 별도 스크립트에서 실행했습니다. 일반 플레이 중에는 전체 경로를 탐색하지 않습니다.</p>`;}
function tutorial(){return `<div class="content-page">${back()}<div class="eyebrow">읽고 바로 시작하는 안내</div><h1>1분 사용법</h1><section class="content-card">${C.tutorialHtml}<div class="actions"><button class="primary" data-action="${hasGame?'resume':'new'}">${hasGame?'이어서 결정하기':'첫 결정 시작하기'} <span class="arrow">→</span></button></div></section><section class="content-card"><h2>숫자는 이렇게 읽습니다</h2><p>번 돈이 늘면 경제성에 유리합니다. 탄소와 순자원 부담은 낮을수록 유리합니다. 부담 증가량은 주황색, 개선은 녹색으로 구분하고, 색을 보지 않아도 부호와 설명으로 알 수 있습니다.</p><p>컴퓨터에서는 탭 키로 버튼을 이동하고 엔터 또는 스페이스로 선택할 수 있습니다. 스마트폰에서는 큰 선택 카드를 누르세요. 그림을 보지 못하더라도 상황 설명과 결과 수치만으로 진행할 수 있습니다.</p></section></div>`;}
function settingsScreen(){return `<div class="content-page">${back()}<h1>설정과 기록</h1><section class="content-card"><h2>화면의 움직임</h2><div class="setting"><input id="reduce-motion" type="checkbox" ${settings.reduced?'checked':''}><label for="reduce-motion">짧은 애니메이션도 줄이기</label></div><p class="muted">기기의 ‘움직임 줄이기’ 설정도 자동으로 따릅니다.</p></section><section class="content-card"><h2>저장 상태</h2><p>${persistent?'진행 상태와 결말 도감을 이 브라우저의 localStorage에 저장합니다.':'저장소에 접근할 수 없어 메모리 모드로 플레이하고 있습니다.'}</p><p>진행 ${hasGame?game.step:0}/20 · 확인한 결말 ${Object.keys(unlocked).length}/54. 다른 브라우저·기기 또는 다른 위치로 파일을 옮기면 기존 기록이 보이지 않을 수 있습니다. 브라우저 데이터를 지우기 전에 결과를 텍스트로 보관하세요.</p><button class="danger" data-action="clear">전체 기록 삭제</button><p class="muted" style="margin-top:12px">진행과 도감을 모두 지우며, 한 번 더 확인합니다.</p></section></div>`;}
function render(scroll=true){dashboard();const screens={home,event:eventScreen,play:eventScreen,result,collection,model,ledger,tutorial,settings:settingsScreen};$('#main').innerHTML=(screens[route]||home)();if(scroll)top();}
function newGame(){game=E.initialState();path=[];phase='choice';hasGame=true;analysisCache=null;warning='';persist();navigate('play');}
function choose(choice,step){if(route!=='play'||phase!=='choice'||step!==game.step||game.step>=20)return;game=E.applyChoice(game,choice,true);path.push(choice);phase='feedback';analysisCache=null;persist();render();}
function next(){if(phase!=='feedback')return;if(game.step===20){phase='result';const id=E.evaluate(game).endingId;unlocked[id]=true;write(S.KEYS.collection,JSON.stringify({version:S.VERSION,ids:Object.keys(unlocked)}));persist();navigate('result');}else{phase='choice';persist();render();}}
async function copy(){const text=resultText();try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(text);toast('플레이 결과를 복사했습니다.');}catch(e){const area=$('.copy-box');area.closest('details').open=true;area.focus();area.select();toast('자동 복사가 제한되었습니다. 선택된 텍스트를 복사하거나 파일로 저장하세요.');}}
function download(){const text=resultText(),url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='다시-자원이-되기까지-플레이결과.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('결과 텍스트 저장을 요청했습니다.');}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.route){navigate(button.dataset.route);return;}if(button.dataset.choice!==undefined){choose(Number(button.dataset.choice),Number(button.dataset.step));return;}if(button.dataset.ending){selectedEnding=button.dataset.ending;render(false);$('#ending-detail').scrollIntoView({block:'center',behavior:'instant'});$('#ending-detail').focus({preventScroll:true});return;}switch(button.dataset.action){case'new':newGame();break;case'resume':hasGame?resume():navigate('home');break;case'next':next();break;case'copy':copy();break;case'download':download();break;case'close-ending':selectedEnding=null;render(false);break;case'clear':if(confirm('진행 상황과 결말 도감을 모두 삭제할까요? 이 게임의 저장 기록만 삭제됩니다.')){remove(S.KEYS.session);remove(S.KEYS.collection);game=E.initialState();path=[];phase='choice';hasGame=false;unlocked={};selectedEnding=null;analysisCache=null;warning='';navigate('home');toast('진행과 결말 도감을 삭제했습니다.');}break;}});
document.addEventListener('change',event=>{if(event.target.id==='reduce-motion'){settings.reduced=event.target.checked;document.documentElement.classList.toggle('reduced-motion',settings.reduced);write(S.KEYS.settings,JSON.stringify(settings));}});
window.addEventListener('popstate',event=>{const r=event.state?.route||location.hash.slice(1)||'home';route=['home','play','result','collection','model','ledger','tutorial','settings'].includes(r)?r:'home';if(!hasGame&&(route==='play'||route==='result'))route='home';if(route==='result'&&phase!=='result')route='play';render();});
window.addEventListener('resize',measure);
if('ResizeObserver'in window)new ResizeObserver(measure).observe($('#dashboard'));
try{history.replaceState({route},'',`#${route}`);}catch(e){}
render(false);
})();



</script>
</body>
</html>
